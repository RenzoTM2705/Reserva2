# Calidad del frontend en cada push y Pull Request.
#
# Solo se ejecuta el frontend: los scripts de base de datos (`pnpm db:*`)
# necesitan credenciales del proyecto Supabase y no deben correr en CI.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test:run

      - name: Build
        run: pnpm build
